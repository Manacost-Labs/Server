version: 1
repository: https://github.com/Manacost-Labs/skills
canonical_root: skills
policy_file: AGENTS.md
engineering_policy: policies/engineering.json
verification_config: .ai/verify.json
verification_entrypoint: make verify
server_entrypoints:
  - /home/debian/AGENTS.md
  - /srv/projects/AGENTS.md
  - /home/debian/server/AGENTS.md
entrypoint_install_script: scripts/install-server-entrypoints.sh
global_agent_entrypoints:
  - /home/debian/.codex/AGENTS.md
  - /home/debian/.config/opencode/AGENTS.md
  - /home/debian/.claude/CLAUDE.md
  - /home/debian/.gemini/GEMINI.md
  - /home/debian/.dsh/AGENTS.md
  - /home/debian/.hermes/AGENTS.md
  - /home/debian/.cursor/rules/AGENTS.md
global_entrypoint_install_script: scripts/install-global-agent-entrypoints.sh
global_agent_adapters:
  - client: cursor
    entrypoint: /home/debian/.cursor/rules/manacost-global.mdc
    source: integrations/cursor/manacost-global.mdc
entrypoint_check_script: scripts/check-agent-entrypoints.sh
inventory_file: inventory/skills.tsv
source_inventory_file: inventory/sources.tsv
external_inventory_file: inventory/external-skills.tsv
inventory_refresh_script: scripts/refresh-sources-inventory.sh

skill_contract:
  directory: skills/<namespace>/<skill-id>
  required_files:
    - SKILL.md
    - skill.yaml
  frontmatter:
    required:
      - name
      - description
  id_pattern: '^[a-z0-9][a-z0-9-]*(/[a-z0-9][a-z0-9-]*)+$'

profiles:
  - id: server
    file: profiles/server.yaml
    purpose: common server operations and agent coordination
  - id: openbot
    file: profiles/openbot.yaml
    purpose: OpenBot chat and frontend work
  - id: hearthpulse
    file: profiles/hearthpulse.yaml
    purpose: HearthPulse application work
  - id: icecrow
    file: profiles/icecrow.yaml
    purpose: IceCrow desktop tracker, headless capture, and HearthPulse profile sync
  - id: wordpress
    file: profiles/wordpress.yaml
    purpose: WordPress sites, plugins, and publishing
  - id: data
    file: profiles/data.yaml
    purpose: parsers, data control, and Python services
  - id: engineering
    file: profiles/engineering.yaml
    purpose: architecture, debugging, domain modeling, and safe refactoring

sources:
  canonical:
    - skills
  local_project_roots:
    - /srv/projects
  local_user_roots:
    - /home/debian/.agents/skills
    - /home/debian/.codex/skills
  shared_catalogs:
    - /opt/ai-agent-resources/skills
    - /opt/ai-agent-resources/repos/skills/skills/.curated
    - /opt/ai-agent-resources/repos/awesome-codex-skills
    - /home/debian/.codex/plugins/cache

external_sources:
  - id: obra/superpowers
    repository: https://github.com/obra/superpowers
    imported_paths: three derived workflow skills
    license: MIT
  - id: Graphify-Labs/graphify
    repository: https://github.com/Graphify-Labs/graphify
    imported_paths: derived server map workflow from graphify/skill-codex.md
    license: Apache-2.0
  - id: ciembor/agent-rules-books
    repository: https://github.com/ciembor/agent-rules-books
    imported_variant: mini
    license: MIT
  - id: nathankim0/clean-architecture-skills
    repository: https://github.com/nathankim0/clean-architecture-skills
    license: MIT
  - id: mattpocock/skills
    repository: https://github.com/mattpocock/skills
    imported_paths: six-requested-engineering-skills-plus-grill-adaptation
    license: MIT
  - id: addyosmani/agent-skills
    repository: https://github.com/addyosmani/agent-skills
    imported_paths: ten-requested-engineering-skills
    license: MIT
  - id: YurunChen/repo-docs-skills
    repository: https://github.com/YurunChen/repo-docs-skills
    imported_paths: repo-docs-and-repo-docs-zh
    license: NO LICENSE FILE FOUND
  - id: softaworks/agent-toolkit
    repository: https://github.com/softaworks/agent-toolkit
    imported_paths: skills/dependency-updater and skills/design-system-starter
    license: MIT
  - id: muratcankoylan/Agent-Skills-for-Context-Engineering
    repository: https://github.com/muratcankoylan/Agent-Skills-for-Context-Engineering
    imported_paths: seven-requested-context-skills
    license: MIT
  - id: uditgoenka/autoresearch
    repository: https://github.com/uditgoenka/autoresearch
    imported_paths: plugins/autoresearch/skills/autoresearch
    license: MIT
  - id: netresearch/github-project-skill
    repository: https://github.com/netresearch/github-project-skill
    imported_paths: skills/github-project
    license: MIT AND CC-BY-SA-4.0
  - id: synthesisengineering/synthesis-skills
    repository: https://github.com/synthesisengineering/synthesis-skills
    imported_paths: skills collection (63 skills)
    license: Apache-2.0 AND CC0-1.0
  - id: fugazi/test-automation-skills-agents
    repository: https://github.com/fugazi/test-automation-skills-agents
    imported_paths: skills collection (10 skills)
    license: MIT
  - id: balyakin/skill-eval-runner
    repository: https://github.com/balyakin/skill-eval-runner
    imported_paths: derived engineering wrapper from README
    license: MIT
  - id: LambdaTest/agent-skills
    repository: https://github.com/LambdaTest/agent-skills
    imported_paths: skills collection (72 skills)
    license: MIT
  - id: me2resh/agent-decision-record
    repository: https://github.com/me2resh/agent-decision-record
    imported_paths: skills/decide and tools/codex/agdr-decide
    license: CC-BY-4.0
  - id: vladikk/modularity
    repository: https://github.com/vladikk/modularity
    imported_paths: skills collection (four skills)
    license: CC-BY-NC-SA-4.0
  - id: millionco/react-doctor
    repository: https://github.com/millionco/react-doctor
    imported_paths: three skills; skills/react-doctor skipped because core/react-doctor already exists
    license: Modified MIT
  - id: vercel-labs/next-skills
    repository: https://github.com/vercel-labs/next-skills
    imported_paths: redirect-only; current skills moved to vercel/next.js
    license: see upstream repository
  - id: vercel/next.js
    repository: https://github.com/vercel/next.js
    imported_paths: canary/skills collection (four skills)
    license: MIT
  - id: addyosmani/web-quality-skills
    repository: https://github.com/addyosmani/web-quality-skills
    imported_paths: skills collection (six skills)
    license: MIT
  - id: jezweb/claude-skills
    repository: https://github.com/jezweb/claude-skills
    imported_paths: plugins/frontend/skills/react-patterns
    license: MIT
  - id: mblode/agent-skills
    repository: https://github.com/mblode/agent-skills
    imported_paths: skills/ui-design
    license: MIT
  - id: nutlope/hallmark
    repository: https://github.com/nutlope/hallmark
    imported_paths: skills/hallmark
    license: MIT
  - id: arvindrk/extract-design-system
    repository: https://github.com/arvindrk/extract-design-system
    imported_paths: skills/extract-design-system
    license: MIT

policy:
  import_mode: additive
  never_edit: production copies, authentication files, secrets, vendor caches
  remove_legacy_only_after: project-enabled-and-verified
  conflict_mode: preserve-explicit-namespaces
